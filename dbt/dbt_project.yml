name: nyc_taxi_platform
version: '2.0.0'
config-version: 2
profile: nyc_taxi_profile
model-paths: [models]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
models:
  nyc_taxi_platform:
    staging:
      +materialized: view
      +schema: staging
    dimensions:
      +materialized: table
      +schema: core
    facts:
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: fail
      +schema: core
      +pre-hook: "{{ delete_selected_months('source_month') }}"
      +post-hook: 'ANALYZE {{ this }}'
    marts:
      +materialized: incremental
      +incremental_strategy: append
      +on_schema_change: fail
      +schema: mart
      +pre-hook: "{{ delete_selected_months('month_start') }}"
      +post-hook: 'ANALYZE {{ this }}'
      +indexes:
        - columns: [month_start]
seeds:
  nyc_taxi_platform:
    +schema: reference
    +quote_columns: true
